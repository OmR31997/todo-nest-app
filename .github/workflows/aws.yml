name: AWS DEPLOY TO EC2

on:
    push:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

env: 
  AWS_REGION: us-east-2b
  EC2_USER: ${{ secrets.EC2_OS_SYSTEM }}
  EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
  INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
  SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
  NODE_VERSION: 24
  APP_NAME: todo-nest-app
  PORT: 3000


jobs:
  ci:
    name: CI (Continuous Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run Tests
        run: npm test
      
      - name: Build Application
        run: npm run build

  cd: 
    name: CD (Continuous Deployment)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts
          ssh -T git@github.com
          
      - name: Deploy to EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            export APP_NAME="${{ env.APP_NAME }}"
            export APP_DIR="$HOME/projects/${{ env.APP_NAME }}"
            export BRANCH_NAME="${{ github.ref_name }}"
            export INSTANCE_ID="${{ env.INSTANCE_ID }}"
            export SNS_TOPIC_ARN="${{ env.SNS_TOPIC_ARN }}"
            bash "$APP_DIR/scripts/deploy.sh"
          EOF

        


            
    
    